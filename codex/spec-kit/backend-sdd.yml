id: backend-sdd
extends: speckit
priority: 10
enabled: true
edits:
- insert_before: review-spec
  step:
    id: clarify
    command: speckit.clarify
    integration: '{{ inputs.integration }}'
    input:
      args: Read AGENTS.md and codex/spec-kit/README.md. Interview the user, reuse existing answers,
        record stable Q-IDs in interview.md. Repeat clarification rounds as needed; do not declare
        requirements ready with blocking gaps.
- replace: review-spec
  step:
    id: review-spec
    type: gate
    message: 'REQUIREMENTS_REVIEW: Read the selected spec and interview. Resolve blocking questions
      through the interactive Codex chat before approving. Approve only this requirements revision;
      this does not authorize implementation.'
    options:
    - approve
    - reject
    on_reject: abort
- insert_before: plan
  step:
    id: record-requirements
    type: prompt
    integration: '{{ inputs.integration }}'
    prompt: Read AGENTS.md and codex/spec-kit/README.md. This native workflow run is {{ context.run_id
      }}. Verify its review-spec gate really completed with approve using native workflow status.
      Record that human requirements confirmation, spec SHA-256, scope and date in feature progress.md.
      If blockers remain or spec changed since review, do not record approval or plan; return to
      the human. Do not write application code.
- remove: review-plan
- insert_before: implement
  step:
    id: analyze
    command: speckit.analyze
    integration: '{{ inputs.integration }}'
    capture: true
    input:
      args: Read-only consistency and constitution analysis of the selected spec/plan/tasks. Do not
        auto-remediate or write progress.
- insert_before: implement
  step:
    id: prepare-approval
    type: prompt
    integration: '{{ inputs.integration }}'
    prompt: Read AGENTS.md and codex/spec-kit/README.md. Inspect the actual analyze result from native
      run {{ context.run_id }}. Separately record its truthful summary and unresolved findings in
      feature progress.md. Prepare a review packet with requirements, proposed design/files, risks,
      verification and API/Study outputs. Record current spec/plan/tasks SHA-256 and set AWAITING_APPROVAL.
      Ask the human to review these exact revisions. Do not self-approve, fix code, or conceal critical
      findings. Critical findings require correction and renewed analysis before approval is valid.
- insert_before: implement
  step:
    id: review-implementation
    type: gate
    message: 'AWAITING_APPROVAL: Read spec.md, plan.md, tasks.md and the analysis/review packet in
      progress.md. Approve implementation of these exact revisions only after blockers are resolved.
      Reject returns work for correction; never approve automatically or on behalf of the user.'
    options:
    - approve
    - reject
    on_reject: abort
- insert_before: implement
  step:
    id: record-approval
    type: prompt
    integration: '{{ inputs.integration }}'
    prompt: Read AGENTS.md and codex/spec-kit/README.md. Verify native run {{ context.run_id }} has
      a completed review-implementation gate with the human choice approve. Confirm the reviewed
      spec/plan/task scope and hashes still match the packet, requirements confirmation is valid
      and analysis has no unresolved critical blockers. Only then record the actual approval evidence
      and approved scope in feature progress.md. Otherwise stop for human review without code changes.
      Never infer approval from this prompt.
- insert_after: implement
  step:
    id: verify
    type: prompt
    integration: '{{ inputs.integration }}'
    prompt: Review approved scope, code diff and tasks against acceptance criteria. Run appropriate
      authorized checks, following AGENTS.md command safety. Write verification.md with actual commands,
      criterion/task mapping, PASS/FAIL/SKIPPED/NOT CONFIGURED/NOT RUN, evidence and limits. Investigate
      failures and record remaining tasks; do not claim critical gaps verified. Do not deploy, migrate,
      install dependencies or expand scope without approval.
- insert_after: implement
  step:
    id: document
    type: prompt
    integration: '{{ inputs.integration }}'
    prompt: Read actual implementation and verification.md. Synchronize owner specs, implemented
      client api-docs and affected Swagger/socket docs; proposed APIs stay labelled. Write useful
      Vietnamese Study with English terms and real code pointers in the existing Study owner. Feature
      study.md links to that canonical note and summarizes learning, not a duplicate. Record real
      N/A reasons. Do not conceal failures or claim deployment. No app code here.
- insert_after: implement
  step:
    id: converge
    command: speckit.converge
    integration: '{{ inputs.integration }}'
    input:
      args: Native append-only assessment of unmet accepted requirements. Do not edit spec/plan/code
        to match implementation or rewrite completed tasks.
- insert_after: implement
  step:
    id: record-outcome
    type: prompt
    integration: '{{ inputs.integration }}'
    prompt: Read the native convergence result, tasks and verification. Record actual outcomes and
      next action in feature progress.md and root PROGRESS.md. COMPLETED requires accepted criteria,
      required checks and docs satisfied. Unmet approved-scope tasks return to IMPLEMENTING/VERIFYING;
      changed scope returns to CLARIFYING and human review. Do not silently execute new scope or
      invent a successful result. Link API docs and canonical Vietnamese Study.
