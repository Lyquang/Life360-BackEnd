services:
  - type: web
    name: family-tracker-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: AUTH_MAX_ACTIVE_SESSIONS
        value: "10"
      - key: REFRESH_RATE_LIMIT
        value: "60"
      - key: LOCATION_BATCH_RATE_LIMIT
        value: "30"
      - key: LOCATION_BATCH_MAX_POINTS
        value: "100"
      - key: LOCATION_BATCH_MAX_AGE_HOURS
        value: "24"
      - key: LOCATION_HISTORY_DENSE_ENABLED
        value: "false"
      - key: LOCATION_HISTORY_MOVING_INTERVAL_SECONDS
        value: "15"
      - key: LOCATION_HISTORY_MOVING_DISTANCE_METERS
        value: "25"
      - key: LOCATION_HISTORY_IDLE_INTERVAL_SECONDS
        value: "300"
      - key: JOURNEY_GAP_THRESHOLD_SECONDS
        value: "180"
      - key: JOURNEY_MAX_POINTS_PER_SEGMENT
        value: "1000"
      - key: JOURNEY_SIMPLIFY_TOLERANCE_METERS
        value: "8"
      - key: HISTORY_RANGE_DEFAULT_LIMIT
        value: "500"
      - key: HISTORY_RANGE_MAX_LIMIT
        value: "1000"
      - key: HISTORY_RANGE_MAX_DAYS
        value: "7"
      # Live trail remains gated off until privacy hooks and production load validation are complete.
      - key: LIVE_TRAIL_ENABLED
        value: "false"
      - key: LIVE_TRAIL_RETENTION_DAYS
        value: "7"
      - key: LIVE_TRAIL_MAX_ACCURACY_METERS
        value: "100"
      - key: LIVE_TRAIL_READ_RATE_LIMIT
        value: "60"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      # Redis cache/session/location (recommended: Upstash Redis; optional)
      - key: REDIS_ENABLED
        value: "false"
      - key: REDIS_URL
        sync: false
      - key: REDIS_KEY_PREFIX
        value: familytracker:
      - key: REDIS_DEFAULT_TTL_SECONDS
        value: "300"
      - key: REDIS_CONNECT_TIMEOUT_MS
        value: "5000"
      - key: REDIS_MAX_RETRIES_PER_REQUEST
        value: "2"
      - key: REDIS_LOCATION_TTL_SECONDS
        value: "300"
      # Cloudflare R2 media upload (optional — leave empty to disable image/voice messages)
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_DOMAIN
        sync: false
      - key: R2_REGION
        value: auto
      - key: R2_UPLOAD_URL_TTL_SECONDS
        value: "300"
      - key: R2_IMAGE_MAX_BYTES
        value: "10485760"
      - key: R2_VOICE_MAX_BYTES
        value: "26214400"
      # Legacy media upload config (optional)
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
