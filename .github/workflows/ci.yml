name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs on the same branch/PR when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Required for GHCR push (packages: write) and PR checks (pull-requests: read)
permissions:
  contents: read
  packages: write
  pull-requests: read

env:
  REGISTRY: ghcr.io
  # github.repository = "owner/repo-name"
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1 — Lint, Audit & Test
  # ════════════════════════════════════════════════════════════════════════════
  ci:
    name: Lint, Audit & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint — syntax check
        run: npm run lint

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-do-not-use-in-production
          TZ: Asia/Ho_Chi_Minh

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2 — Build & Push Docker image to GHCR
  # Only runs after ci job passes, and only on push (not on PR from forks)
  # ════════════════════════════════════════════════════════════════════════════
  docker:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    needs: ci
    # Skip on PRs — GITHUB_TOKEN from forks cannot push to GHCR
    if: github.event_name == 'push'

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Docker Buildx (enables multi-platform & layer cache) ───────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Log in to GitHub Container Registry ───────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 4. Normalize image name ──────────────────────────────────────────────
      # Docker image names must be lowercase, even if the GitHub repo uses caps.
      - name: Normalize Docker image name
        id: image
        run: echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      # ── 5. Extract image metadata (tags + labels) ────────────────────────────
      # Tags produced:
      #   - ghcr.io/owner/repo:sha-<short-sha>   (every push)
      #   - ghcr.io/owner/repo:main               (push to main)
      #   - ghcr.io/owner/repo:develop            (push to develop)
      #   - ghcr.io/owner/repo:latest             (push to main only)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # ── 6. Build and push ────────────────────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # GitHub Actions cache to speed up repeated builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 7. Trigger Render deploy after GHCR image is pushed ─────────────────
      # Add this secret in GitHub:
      # Settings > Secrets and variables > Actions > RENDER_DEPLOY_HOOK_URL
      - name: Trigger Render Deploy Hook
        if: success() && github.ref == 'refs/heads/main'
        run: |
          echo "Triggering Render deployment..."
          curl --fail --show-error --silent -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
