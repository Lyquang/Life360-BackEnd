apiVersion: 1
datasources:
  - name: FamilyTracker Local
    uid: familytracker-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 60s
  - name: FamilyTracker Loki
    uid: familytracker-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"traceId":"([0-9a-f]{32})"'
          datasourceUid: familytracker-tempo
          url: '$${__value.raw}'
          urlDisplayLabel: View trace
  - name: FamilyTracker Tempo
    uid: familytracker-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: familytracker-loki
        spanStartTimeShift: 1h
        spanEndTimeShift: 1h
        filterByTraceID: true
        filterBySpanID: false
        tags:
          - key: service.name
            value: service
